[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mas-recon"
version = "0.1.0"
description = "Point it at a running multi-agent system; get back the real agent topology and silent-failure report, from an actual run, not a static guess."
requires-python = ">=3.10"
dependencies = [
    "opentelemetry-sdk>=1.27.0",
]

[project.optional-dependencies]
langchain = ["openinference-instrumentation-langchain"]
strands = ["strands-agents"]
crewai = ["openinference-instrumentation-crewai"]
autogen = ["openinference-instrumentation-autogen-agentchat"]
all = [
    "openinference-instrumentation-langchain",
    "strands-agents",
    "openinference-instrumentation-crewai",
    "openinference-instrumentation-autogen-agentchat",
]

[project.scripts]
mas-recon = "mas_recon.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["mas_recon"]
